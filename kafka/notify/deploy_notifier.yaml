apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier-rma
  namespace: streaming
spec:
  replicas: 1
  selector: { matchLabels: { app: rma-notifier } }
  template:
    metadata: { labels: { app: rma-notifier } }
    spec:
      serviceAccountName: rma-noti-sa
      containers:
      - name: app
        image: ganplank/noti:0.0.8
        imagePullPolicy: IfNotPresent
        env:
        - { name: KAFKA_BOOTSTRAP, value: "doa-kafka-kafka-bootstrap.streaming.svc.cluster.local:9092" }
        - { name: NOTIFY_TOPIC,    value: "notify.rma" }
        - { name: NOTI_GROUP_ID,   value: "notifier-rma" }
        - { name: AUTO_OFFSET_RESET, value: "earliest" }

        # SMTP
        - { name: SMTP_HOST,  value: "smtp.dooray.com" }
        - { name: SMTP_PORT,  value: "465" }
        - { name: SMTP_USER,  valueFrom: { secretKeyRef: { name: smtp-owner, key: username } } }
        - { name: SMTP_PASS,  valueFrom: { secretKeyRef: { name: smtp-owner, key: password } } }
        - { name: MAIL_FROM,  value: "hs.bang@piolink.com" }
        - { name: MAIL_SUBJECT, value: "[RMA] 접수 알림 - {ticket_id}" }

        # Slack
        #- { name: SLACK_WEBHOOK_URL, valueFrom: { secretKeyRef: { name: slack-secret, key: webhook } } }
        #- { name: SLACK_MENTION,     value: "<!channel>" }

        # ETC
        #- { name: DLQ_TOPIC, value: "notify.rma.dlq"" }


