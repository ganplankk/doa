kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: read-smtp-secret
  namespace: streaming
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["noti-smtp-cred"]
  verbs: ["get"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: read-smtp-secret-binding
  namespace: streaming
subjects:
- kind: ServiceAccount
  name: rma-noti-sa   
  namespace: rma
roleRef:
  kind: Role
  name: read-smtp-secret
  apiGroup: rbac.authorization.k8s.io
