apiVersion: v1
kind: Namespace
metadata:
  name: rma
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
  namespace: rma
type: Opaque
stringData:
  PGHOST: "pg-postgresql.data.svc.cluster.local"   # 실제 주소로 조정
  PGPORT: "5432"
  PGUSER: "rma_user"
  PGPASSWORD: "piolink.com1!"
  PGDATABASE: "doadb"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rma-web
  namespace: rma
spec:
  replicas: 1
  selector:
    matchLabels: { app: rma-web }
  template:
    metadata:
      labels: { app: rma-web }
    spec:
      containers:
      - name: web
        image: ganplank/rma-web:10.1.2
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "8080"
        envFrom:
        - secretRef: { name: pg-secret }
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rma-web-svc
  namespace: rma
spec:
  selector: { app: rma-web }
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: NodePort

